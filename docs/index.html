<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Python Alapjai - kurzusok és jegyzetek a Python programozás alapjairól."
    />
    <title>Python Alapjai</title>
    <style>
      :root {
        color-scheme: dark;
        /* Blowfish "ocean" scheme */
        --bg: #0f172a;
        --surface: #1e293b;
        --border: #334155;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --primary: #60a5fa;
        --secondary: #22d3ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        line-height: 1.5;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto 0;
        height: 3px;
        background: linear-gradient(to right, var(--primary), var(--secondary));
      }

      main {
        width: 100%;
        max-width: 52rem;
        padding: 3rem 1.5rem;
      }

      .kicker {
        margin: 0 0 0.25rem;
        color: var(--secondary);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 2rem;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .courses {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }

      .course {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 6.5rem 6.5rem 7.5rem;
        gap: 0.75rem;
        align-items: stretch;
        padding: 1rem 1.25rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
      }

      .lecke {
        display: flex;
        align-items: center;
        gap: 1rem;
        min-width: 0;
      }

      .lecke .title {
        font-weight: 600;
      }

      .cell,
      .cell-disabled {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: rgba(15, 23, 42, 0.5);
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
      }

      a.cell {
        color: var(--text-muted);
        transition:
          border-color 0.15s ease,
          color 0.15s ease;
      }

      a.cell:hover,
      a.cell:focus-visible {
        border-color: var(--primary);
        color: var(--primary);
      }

      .cell-disabled {
        color: #64748b;
        opacity: 0.55;
        cursor: default;
      }

      .num {
        padding: 0.35rem 0.6rem;
        border: 1px solid rgba(34, 211, 238, 0.25);
        border-radius: 0.5rem;
        background: rgba(34, 211, 238, 0.1);
        color: var(--secondary);
        font-size: 0.85rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="kicker">Python Világ</p>
        <h1>Python Alapjai</h1>
      </header>
      <ul class="courses">
        <li class="course">
          <div class="lecke">
            <span class="num">00</span>
            <span class="title">Bevezetés és kurzusinformációk</span>
          </div>
          <a class="cell" href="00_Bevezetes_es_kurzusinformaciok/">Elmélet</a>
          <a class="cell" href="00_Bevezetes_es_kurzusinformaciok_kviz/">Kvíz</a>
          <span class="cell-disabled" title="Hamarosan">Gyakorlat</span>
        </li>
        <li class="course">
          <div class="lecke">
            <span class="num">01</span>
            <span class="title">A Python programozási nyelvről</span>
          </div>
          <a class="cell" href="01_A_Python_programozasi_nyelvrol/">Elmélet</a>
          <a class="cell" href="01_A_Python_programozasi_nyelvrol_kviz/">Kvíz</a>
          <span class="cell-disabled" title="Hamarosan">Gyakorlat</span>
        </li>
        <li class="course">
          <div class="lecke">
            <span class="num">02</span>
            <span class="title">Változók, típusok és műveleteik</span>
          </div>
          <a
            class="cell"
            href="https://pythonvilag.hu/pv/python/python_alapjai/02_Valtozok_tipusok_es_muveleteik/"
            target="_blank"
            rel="noopener"
            >Elmélet</a
          >
          <span class="cell-disabled" title="Hamarosan">Kvíz</span>
          <a
            class="cell"
            href="https://colab.research.google.com/github/PythonVilag/Python_alapjai/blob/main/02_Valtozok_tipusok_es_muveleteik/02_Valtozok_tipusok_es_muveleteik_gyakorlat.ipynb"
            target="_blank"
            rel="noopener"
            >Gyakorlat</a
          >
        </li>
        <li class="course">
          <div class="lecke">
            <span class="num">03</span>
            <span class="title">Komment, kiírás, bekérés</span>
          </div>
          <a
            class="cell"
            href="https://pythonvilag.hu/pv/python/python_alapjai/03_Komment_kiiras_bekeres/"
            target="_blank"
            rel="noopener"
            >Elmélet</a
          >
          <span class="cell-disabled" title="Hamarosan">Kvíz</span>
          <a
            class="cell"
            href="https://colab.research.google.com/github/PythonVilag/Python_alapjai/blob/main/03_Komment_kiiras_bekeres/03_Komment_kiiras_bekeres_gyakorlat.ipynb"
            target="_blank"
            rel="noopener"
            >Gyakorlat</a
          >
        </li>
      </ul>
    </main>
  </body>
</html>
